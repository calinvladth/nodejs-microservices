name: Docker CI for GHCR

on:
  push:
    branches:
      - master
      - pick-on-maps

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr
        run:
          docker login --username ${{secrets.DOCKER_USERNAME}} --password ${{secrets.GHCR_TOKEN}} ghcr.io

      - name: Build images
        run: |
          docker build customer -t ghcr.io/${{secrets.DOCKER_USERNAME}}/customer_service:latest
          docker build email -t ghcr.io/${{secrets.DOCKER_USERNAME}}/email_service:latest
          docker build maps -t ghcr.io/${{secrets.DOCKER_USERNAME}}/maps_service:latest
          docker build ui/pick-on-maps -t ghcr.io/${{secrets.DOCKER_USERNAME}}/ui_pick_on_maps:latest

      - name: Publish images
        run: |
          docker push ghcr.io/${{secrets.DOCKER_USERNAME}}/customer_service:latest
          docker push ghcr.io/${{secrets.DOCKER_USERNAME}}/email_service:latest
          docker push ghcr.io/${{secrets.DOCKER_USERNAME}}/maps_service:latest
          docker push ghcr.io/${{secrets.DOCKER_USERNAME}}/ui_pick_on_maps:latest
